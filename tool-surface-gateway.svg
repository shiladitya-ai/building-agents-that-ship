<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f6ea8"/>
    </marker>
    <marker id="arrowr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowg" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
  </defs>
  <rect width="1060" height="700" fill="#ffffff"/>
  <text x="34" y="44" font-size="24" font-weight="700" fill="#1b1b1f">Tool-Call Mediation Gateway</text>
  <text x="34" y="70" font-size="14" fill="#5a5a66">The model <tspan font-style="italic">proposes</tspan> a tool call; a policy gateway <tspan font-style="italic">decides</tspan>. Every control lives in code &#8212; outside the reach of any injection.</text>

  <!-- Threat: untrusted content -->
  <rect x="34" y="104" width="228" height="150" rx="12" fill="#fdecea" stroke="#e6a79f"/>
  <text x="148" y="130" font-size="14.5" font-weight="700" fill="#a5281b" text-anchor="middle">&#9888; Untrusted content</text>
  <text x="148" y="154" font-size="12" fill="#8a3025" text-anchor="middle">web pages &#183; documents</text>
  <text x="148" y="174" font-size="12" fill="#8a3025" text-anchor="middle">emails &#183; API responses</text>
  <text x="148" y="194" font-size="12" fill="#8a3025" text-anchor="middle">code &#183; tool output</text>
  <text x="148" y="222" font-size="11.5" font-style="italic" fill="#a5281b" text-anchor="middle">may carry hidden</text>
  <text x="148" y="238" font-size="11.5" font-style="italic" fill="#a5281b" text-anchor="middle">instructions (injection)</text>

  <!-- Agent -->
  <rect x="34" y="300" width="228" height="150" rx="12" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="148" y="356" font-size="17" font-weight="700" fill="#12306e" text-anchor="middle">Agent / model</text>
  <text x="148" y="384" font-size="12" fill="#33445f" text-anchor="middle">reads content, forms intent,</text>
  <text x="148" y="402" font-size="12" fill="#33445f" text-anchor="middle">and <tspan font-weight="700">proposes</tspan> a tool call</text>

  <!-- injection arrow into agent -->
  <path d="M148,254 L148,298" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowr)"/>
  <text x="158" y="282" font-size="11" fill="#c0392b" font-style="italic">reads</text>

  <!-- proposes arrow to gateway -->
  <path d="M262,375 L360,375" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="365" font-size="11.5" fill="#4f6ea8" font-style="italic">proposes</text>
  <text x="270" y="396" font-size="10.5" fill="#8a8a96">(untrusted request)</text>

  <!-- Gateway -->
  <rect x="366" y="104" width="330" height="470" rx="14" fill="#f7f9fc" stroke="#c7d3e6" stroke-width="2"/>
  <text x="531" y="136" font-size="17" font-weight="700" fill="#12306e" text-anchor="middle">Policy Gateway</text>
  <text x="531" y="158" font-size="11.5" fill="#5a5a66" text-anchor="middle">decides &#8212; treat model output as an untrusted request</text>

  <!-- controls -->
  <rect x="392" y="176" width="278" height="52" rx="9" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="410" y="198" font-size="13.5" font-weight="700" fill="#12306e">1 &#183; Authorize</text>
  <text x="410" y="217" font-size="11" fill="#33445f">within the task&#8217;s scoped, least-privilege grant?</text>

  <rect x="392" y="238" width="278" height="52" rx="9" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="410" y="260" font-size="13.5" font-weight="700" fill="#12306e">2 &#183; Validate input</text>
  <text x="410" y="279" font-size="11" fill="#33445f">schema + bounds; no traversal, no injection</text>

  <rect x="392" y="300" width="278" height="52" rx="9" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="410" y="322" font-size="13.5" font-weight="700" fill="#8a3b00">3 &#183; Egress control</text>
  <text x="410" y="341" font-size="11" fill="#7a3400">destination on the allowlist? (exfil defense)</text>

  <rect x="392" y="362" width="278" height="52" rx="9" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="410" y="384" font-size="13.5" font-weight="700" fill="#8a3b00">4 &#183; Rate &#38; quota</text>
  <text x="410" y="403" font-size="11" fill="#7a3400">cap a compromised agent&#8217;s throughput</text>

  <rect x="392" y="424" width="278" height="52" rx="9" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="410" y="446" font-size="13.5" font-weight="700" fill="#8a3b00">5 &#183; Human approval</text>
  <text x="410" y="465" font-size="11" fill="#7a3400">high-blast / irreversible calls gated</text>

  <rect x="392" y="486" width="278" height="52" rx="9" fill="#eefaf1" stroke="#a9dcbb"/>
  <text x="410" y="508" font-size="13.5" font-weight="700" fill="#14562c">6 &#183; Audit log</text>
  <text x="410" y="527" font-size="11" fill="#245c38">every proposed + executed call, replayable</text>

  <!-- deny loop back -->
  <path d="M531,552 Q531,610 148,610 Q60,610 60,456" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowr)"/>
  <text x="300" y="628" font-size="11.5" fill="#c0392b" font-style="italic" text-anchor="middle">deny / escalate &#8212; blocked call never reaches a tool</text>

  <!-- allow arrow to tools -->
  <path d="M696,300 L792,300" fill="none" stroke="#2f8f57" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <text x="702" y="290" font-size="11.5" fill="#2f8f57" font-style="italic">allow</text>

  <!-- Tools -->
  <rect x="798" y="176" width="228" height="248" rx="12" fill="#eefaf1" stroke="#a9dcbb"/>
  <text x="912" y="204" font-size="15" font-weight="700" fill="#14562c" text-anchor="middle">Tools / tenant APIs</text>
  <text x="912" y="234" font-size="12" fill="#245c38" text-anchor="middle">directory &#183; data stores</text>
  <text x="912" y="256" font-size="12" fill="#245c38" text-anchor="middle">HTTP fetch &#183; queries</text>
  <text x="912" y="278" font-size="12" fill="#245c38" text-anchor="middle">messaging &#183; provisioning</text>
  <rect x="820" y="300" width="184" height="104" rx="9" fill="#ffffff" stroke="#cfe6d8"/>
  <text x="912" y="324" font-size="11.5" font-weight="700" fill="#14562c" text-anchor="middle">Scoped credential</text>
  <text x="912" y="346" font-size="11" fill="#245c38" text-anchor="middle">task / tenant / resource</text>
  <text x="912" y="364" font-size="11" fill="#245c38" text-anchor="middle">minutes-long TTL</text>
  <text x="912" y="386" font-size="11" fill="#245c38" text-anchor="middle">read-only by default</text>

  <!-- bottom principle bar -->
  <rect x="34" y="648" width="992" height="40" rx="10" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="530" y="673" font-size="13.5" font-weight="700" fill="#8a3b00" text-anchor="middle">Least privilege bounds what an injection can accomplish. If a tool can&#8217;t be safely bounded, remove it &#8212; don&#8217;t fence it.</text>

  <text x="740" y="452" font-size="11.5" font-style="italic" fill="#8a8a96">Every tool that can emit data is an exfiltration channel.</text>
  <text x="740" y="470" font-size="11.5" font-style="italic" fill="#8a8a96">Building Agents That Ship &#183; Part 9 &#8212; finale.</text>
</svg>
