<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b86"/>
    </marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/>
    </marker>
  </defs>
  <rect width="1060" height="760" fill="#ffffff"/>
  <text x="30" y="40" font-size="25" font-weight="700" fill="#1b1b1f">Should You Go Multi-Agent? — A Decision Tree</text>
  <text x="30" y="66" font-size="14" fill="#5a5a66">Multi-agent is an optimization, not a default. Start single-threaded; make the second agent earn its place (archetype: complex migration).</text>

  <!-- Column headers -->
  <text x="340" y="100" font-size="13" font-weight="700" fill="#8a94a6" text-anchor="middle" letter-spacing="1">ASK IN ORDER</text>
  <text x="880" y="100" font-size="13" font-weight="700" fill="#8a94a6" text-anchor="middle" letter-spacing="1">DEFAULT OUTCOME</text>

  <!-- Big single-agent outcome (right column) -->
  <rect x="720" y="120" width="310" height="360" rx="14" fill="#eefaf1" stroke="#7cc79a" stroke-width="2"/>
  <text x="875" y="158" font-size="20" font-weight="700" fill="#14562c" text-anchor="middle">SINGLE AGENT</text>
  <text x="875" y="182" font-size="14" fill="#2c6b45" text-anchor="middle">(or a plain workflow)</text>
  <line x1="745" y1="200" x2="1005" y2="200" stroke="#bfe2cc"/>
  <text x="760" y="228" font-size="13.5" fill="#2c5540">• One coherent thread of context</text>
  <text x="760" y="256" font-size="13.5" fill="#2c5540">• Good tools + good memory</text>
  <text x="760" y="284" font-size="13.5" fill="#2c5540">• Cheaper, simpler, debuggable</text>
  <text x="760" y="320" font-size="13.5" fill="#2c5540" font-weight="700">Any "NO" (or unsure) lands here.</text>
  <text x="760" y="352" font-size="12.5" fill="#5a7566">"Feels too simple for a big problem"</text>
  <text x="760" y="372" font-size="12.5" fill="#5a7566">is an aesthetic, not a reason. The</text>
  <text x="760" y="392" font-size="12.5" fill="#5a7566">SHAPE of the work decides — not</text>
  <text x="760" y="412" font-size="12.5" fill="#5a7566">its size.</text>
  <text x="760" y="448" font-size="12.5" fill="#8a5a1f" font-style="italic">e.g. the migration: interdependent</text>
  <text x="760" y="466" font-size="12.5" fill="#8a5a1f" font-style="italic">steps → one orchestrated agent.</text>

  <!-- Start -->
  <rect x="230" y="120" width="220" height="52" rx="26" fill="#12306e"/>
  <text x="340" y="152" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">You have a big task</text>

  <!-- Q1 -->
  <rect x="200" y="210" width="280" height="78" rx="12" fill="#eef4ff" stroke="#8aa6dd" stroke-width="1.5"/>
  <text x="340" y="240" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">1. Genuinely parallel?</text>
  <text x="340" y="264" font-size="12.5" fill="#33445f" text-anchor="middle">many subtasks that can run at once</text>
  <text x="340" y="280" font-size="12.5" fill="#33445f" text-anchor="middle">(not one sequential chain)</text>

  <!-- Q2 -->
  <rect x="200" y="330" width="280" height="78" rx="12" fill="#eef4ff" stroke="#8aa6dd" stroke-width="1.5"/>
  <text x="340" y="360" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">2. Context-independent?</text>
  <text x="340" y="384" font-size="12.5" fill="#33445f" text-anchor="middle">subtasks DON'T share evolving state</text>
  <text x="340" y="400" font-size="12.5" fill="#33445f" text-anchor="middle">or need to talk mid-run</text>

  <!-- Q3 -->
  <rect x="200" y="450" width="280" height="78" rx="12" fill="#eef4ff" stroke="#8aa6dd" stroke-width="1.5"/>
  <text x="340" y="480" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">3. Worth the tax?</text>
  <text x="340" y="504" font-size="12.5" fill="#33445f" text-anchor="middle">parallel throughput beats the</text>
  <text x="340" y="520" font-size="12.5" fill="#33445f" text-anchor="middle">coordination + ~15&#215; token cost</text>

  <!-- Q4 -->
  <rect x="200" y="570" width="280" height="78" rx="12" fill="#eef4ff" stroke="#8aa6dd" stroke-width="1.5"/>
  <text x="340" y="600" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">4. Single agent hit a wall?</text>
  <text x="340" y="624" font-size="12.5" fill="#33445f" text-anchor="middle">a real, named limit — not</text>
  <text x="340" y="640" font-size="12.5" fill="#33445f" text-anchor="middle">"it felt too simple"</text>

  <!-- Multi-agent outcome -->
  <rect x="200" y="678" width="280" height="62" rx="14" fill="#e9f2fd" stroke="#2f6fd0" stroke-width="2"/>
  <text x="340" y="706" font-size="18" font-weight="700" fill="#1b4e9b" text-anchor="middle">MULTI-AGENT FAN-OUT</text>
  <text x="340" y="728" font-size="12.5" fill="#2c517f" text-anchor="middle">lead fans out → parallel sub-agents → merge  ·  e.g. "assess 500 tenants"</text>

  <!-- YES vertical arrows -->
  <line x1="340" y1="172" x2="340" y2="210" stroke="#5a6b86" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="288" x2="340" y2="330" stroke="#2f6fd0" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="356" y="314" font-size="13" font-weight="700" fill="#2f6fd0">YES</text>
  <line x1="340" y1="408" x2="340" y2="450" stroke="#2f6fd0" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="356" y="434" font-size="13" font-weight="700" fill="#2f6fd0">YES</text>
  <line x1="340" y1="528" x2="340" y2="570" stroke="#2f6fd0" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="356" y="554" font-size="13" font-weight="700" fill="#2f6fd0">YES</text>
  <line x1="340" y1="648" x2="340" y2="678" stroke="#2f6fd0" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="356" y="670" font-size="13" font-weight="700" fill="#2f6fd0">YES</text>

  <!-- NO arrows to single-agent box -->
  <path d="M480,249 C600,249 630,260 718,270" fill="none" stroke="#2f8f57" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="560" y="242" font-size="13" font-weight="700" fill="#2f8f57">NO</text>
  <path d="M480,369 C600,369 640,330 718,308" fill="none" stroke="#2f8f57" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="560" y="362" font-size="13" font-weight="700" fill="#2f8f57">NO</text>
  <path d="M480,489 C610,489 650,380 718,346" fill="none" stroke="#2f8f57" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="560" y="482" font-size="13" font-weight="700" fill="#2f8f57">NO</text>
  <path d="M480,609 C620,609 660,420 718,384" fill="none" stroke="#2f8f57" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="560" y="602" font-size="13" font-weight="700" fill="#2f8f57">NO</text>

  <!-- footer rule -->
  <text x="30" y="752" font-size="12.5" fill="#8a94a6">The one question underneath all four: do the subtasks need to talk to each other while they run? No → fan out.  Yes → one agent.</text>
</svg>
