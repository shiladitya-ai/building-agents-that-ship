<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f6ea8"/>
    </marker>
    <marker id="arrowg" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1b1b1f">Closed-Loop Self-Healing &amp; Continuous Learning</text>
  <text x="30" y="66" font-size="14" fill="#5a5a66">Recovery as a system property, not a pager. Each cycle also produces the signal that improves the next.</text>

  <!-- loop arrows (clockwise) -->
  <path d="M560,150 Q690,180 720,270" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M735,362 Q735,440 690,472" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M566,500 L438,500" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M282,468 Q235,435 235,362" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M270,268 Q300,180 432,152" fill="none" stroke="#4f6ea8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- center guardrails -->
  <rect x="395" y="300" width="210" height="86" rx="12" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="500" y="328" font-size="13" font-weight="700" fill="#8a3b00" text-anchor="middle">Guardrails</text>
  <text x="500" y="348" font-size="11" fill="#7a3400" text-anchor="middle">bounded blast radius ·</text>
  <text x="500" y="364" font-size="11" fill="#7a3400" text-anchor="middle">confidence gating ·</text>
  <text x="500" y="380" font-size="11" fill="#7a3400" text-anchor="middle">policy &amp; least privilege</text>

  <!-- nodes -->
  <!-- Detect -->
  <rect x="420" y="118" width="160" height="64" rx="10" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="500" y="146" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">1 · Detect</text>
  <text x="500" y="166" font-size="10.5" fill="#33445f" text-anchor="middle">observability · anomaly · eval signal</text>
  <!-- Diagnose -->
  <rect x="675" y="268" width="160" height="72" rx="10" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="755" y="296" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">2 · Diagnose</text>
  <text x="755" y="316" font-size="10.5" fill="#33445f" text-anchor="middle">root-cause ·</text>
  <text x="755" y="330" font-size="10.5" fill="#33445f" text-anchor="middle">trajectory replay</text>
  <!-- Remediate -->
  <rect x="560" y="468" width="180" height="86" rx="10" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="650" y="494" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">3 · Remediate</text>
  <text x="650" y="513" font-size="10.5" fill="#33445f" text-anchor="middle">compensate · rollback · re-plan</text>
  <text x="650" y="531" font-size="10" fill="#8a3b00" text-anchor="middle">semi-auto: propose+approve</text>
  <text x="650" y="545" font-size="10" fill="#8a3b00" text-anchor="middle">auto: bounded execute</text>
  <!-- Verify -->
  <rect x="270" y="468" width="160" height="72" rx="10" fill="#eaf1ff" stroke="#b9cdf2"/>
  <text x="350" y="496" font-size="15" font-weight="700" fill="#12306e" text-anchor="middle">4 · Verify</text>
  <text x="350" y="516" font-size="10.5" fill="#33445f" text-anchor="middle">post-condition eval ·</text>
  <text x="350" y="530" font-size="10.5" fill="#33445f" text-anchor="middle">guardrail check</text>
  <!-- Learn -->
  <rect x="160" y="266" width="160" height="76" rx="10" fill="#eefaf1" stroke="#a9dcbb"/>
  <text x="240" y="294" font-size="15" font-weight="700" fill="#14562c" text-anchor="middle">5 · Learn</text>
  <text x="240" y="314" font-size="10.5" fill="#245c38" text-anchor="middle">label trace · reward</text>
  <text x="240" y="328" font-size="10.5" fill="#245c38" text-anchor="middle">signal · RL update</text>

  <!-- learn -> guardrails/policy feedback -->
  <path d="M322,326 Q360,352 393,350" fill="none" stroke="#2f8f57" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowg)"/>
  <text x="352" y="372" font-size="10.5" fill="#2f8f57" font-style="italic">RL signal &#8594; policy</text>

  <!-- RL panel -->
  <rect x="700" y="470" width="270" height="150" rx="10" fill="#f6faf7" stroke="#cfe6d8"/>
  <text x="716" y="494" font-size="13" font-weight="700" fill="#14562c">Learning signal sources &amp; methods</text>
  <text x="716" y="516" font-size="11" fill="#245c38">Sources: traces · human edits/approvals ·</text>
  <text x="716" y="532" font-size="11" fill="#245c38">eval outcomes · guardrail hits · outcomes</text>
  <text x="716" y="554" font-size="11" fill="#245c38">Methods: RLHF · RLAIF · reward modeling ·</text>
  <text x="716" y="570" font-size="11" fill="#245c38">verifier rewards · offline RL · DPO</text>
  <text x="716" y="592" font-size="11" fill="#245c38">Safety: reward-hacking defense · offline</text>
  <text x="716" y="608" font-size="11" fill="#245c38">eval gate · canary/shadow · HITL labels</text>

  <text x="30" y="628" font-size="11" fill="#8a8a96">Autonomy of remediation is earned: semi-autonomous by default; fully autonomous only when reliability, eval &amp; accountability are mature.</text>
</svg>
