<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="780" viewBox="0 0 1060 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fb" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
  </defs>
  <rect width="1060" height="780" fill="#ffffff"/>
  <text x="30" y="40" font-size="25" font-weight="700" fill="#1b1b1f">Reference Architecture — Production-Grade Agentic AI</text>
  <text x="30" y="66" font-size="14" fill="#5a5a66">Layered control plane for high-stakes, multi-step enterprise workflows (archetype: tenant onboarding / provisioning).</text>

  <!-- Left rail: Governance / HITL -->
  <rect x="30" y="90" width="150" height="520" rx="10" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="105" y="118" font-size="14" font-weight="700" fill="#12306e" text-anchor="middle">Governance</text>
  <text x="105" y="136" font-size="14" font-weight="700" fill="#12306e" text-anchor="middle">&amp; Human-in-Loop</text>
  <line x1="45" y1="150" x2="165" y2="150" stroke="#b9cdf2"/>
  <text x="45" y="176" font-size="11.5" fill="#33445f">• Approval gates</text>
  <text x="45" y="200" font-size="11.5" fill="#33445f">• Checkpoint sign-off</text>
  <text x="45" y="224" font-size="11.5" fill="#33445f">• Confidence-based</text>
  <text x="58" y="240" font-size="11.5" fill="#33445f">escalation</text>
  <text x="45" y="264" font-size="11.5" fill="#33445f">• Policy &amp; guardrails</text>
  <text x="45" y="288" font-size="11.5" fill="#33445f">• Consent &amp; scope</text>
  <text x="105" y="330" font-size="12" font-weight="700" fill="#12306e" text-anchor="middle">cross-cutting</text>
  <polygon points="180,380 200,368 200,392" fill="#8aa6dd"/>

  <!-- Right rail: Observability / Eval -->
  <rect x="880" y="90" width="150" height="520" rx="10" fill="#eefaf1" stroke="#a9dcbb"/>
  <text x="955" y="118" font-size="14" font-weight="700" fill="#14562c" text-anchor="middle">Observability</text>
  <text x="955" y="136" font-size="14" font-weight="700" fill="#14562c" text-anchor="middle">&amp; Evaluation</text>
  <line x1="895" y1="150" x2="1015" y2="150" stroke="#a9dcbb"/>
  <text x="895" y="176" font-size="11.5" fill="#245c38">• Distributed tracing</text>
  <text x="895" y="200" font-size="11.5" fill="#245c38">• Trajectory eval</text>
  <text x="895" y="224" font-size="11.5" fill="#245c38">• Guardrail metrics</text>
  <text x="895" y="248" font-size="11.5" fill="#245c38">• Cost / latency SLOs</text>
  <text x="895" y="272" font-size="11.5" fill="#245c38">• Online / canary eval</text>
  <text x="895" y="296" font-size="11.5" fill="#245c38">• Anomaly detection</text>
  <text x="955" y="330" font-size="12" font-weight="700" fill="#14562c" text-anchor="middle">cross-cutting</text>
  <polygon points="880,380 860,368 860,392" fill="#7fc79a"/>

  <!-- Center stack -->
  <!-- Agent Core -->
  <rect x="200" y="100" width="660" height="120" rx="10" fill="#f4f7ff" stroke="#c7d4ee"/>
  <text x="216" y="124" font-size="15" font-weight="700" fill="#1b1b1f">Agent Core</text>
  <rect x="220" y="134" width="195" height="70" rx="8" fill="#ffffff" stroke="#c7d4ee"/>
  <text x="317" y="162" font-size="13" font-weight="700" fill="#12306e" text-anchor="middle">Planner</text>
  <text x="317" y="182" font-size="10.5" fill="#5a5a66" text-anchor="middle">decompose · sequence</text>
  <text x="317" y="196" font-size="10.5" fill="#5a5a66" text-anchor="middle">replan on failure</text>
  <rect x="432" y="134" width="195" height="70" rx="8" fill="#ffffff" stroke="#c7d4ee"/>
  <text x="529" y="162" font-size="13" font-weight="700" fill="#12306e" text-anchor="middle">Executor</text>
  <text x="529" y="182" font-size="10.5" fill="#5a5a66" text-anchor="middle">invoke tools · observe</text>
  <text x="529" y="196" font-size="10.5" fill="#5a5a66" text-anchor="middle">retry · verify</text>
  <rect x="644" y="134" width="196" height="70" rx="8" fill="#ffffff" stroke="#c7d4ee"/>
  <text x="742" y="156" font-size="13" font-weight="700" fill="#12306e" text-anchor="middle">Memory</text>
  <text x="742" y="176" font-size="10.5" fill="#5a5a66" text-anchor="middle">working · episodic</text>
  <text x="742" y="190" font-size="10.5" fill="#5a5a66" text-anchor="middle">semantic · retrieval</text>

  <polygon points="530,232 520,222 540,222" fill="#9aa7bf"/>

  <!-- Orchestration -->
  <rect x="200" y="240" width="660" height="58" rx="10" fill="#eef1f8" stroke="#c7d4ee"/>
  <text x="216" y="264" font-size="15" font-weight="700" fill="#1b1b1f">Orchestration</text>
  <text x="216" y="284" font-size="11.5" fill="#5a5a66">task routing · single-agent vs. supervisor/worker · state machine · concurrency control</text>

  <polygon points="530,310 520,300 540,300" fill="#9aa7bf"/>

  <!-- Reliability control plane -->
  <rect x="200" y="318" width="660" height="104" rx="10" fill="#fff4ec" stroke="#f2c9a8"/>
  <text x="216" y="342" font-size="15" font-weight="700" fill="#8a3b00">Reliability Control Plane</text>
  <g font-size="11" fill="#7a3400">
    <rect x="216" y="352" width="120" height="26" rx="13" fill="#ffe6d3"/><text x="276" y="369" text-anchor="middle">Idempotency</text>
    <rect x="344" y="352" width="150" height="26" rx="13" fill="#ffe6d3"/><text x="419" y="369" text-anchor="middle">Sagas / compensation</text>
    <rect x="502" y="352" width="150" height="26" rx="13" fill="#ffe6d3"/><text x="577" y="369" text-anchor="middle">Checkpoint / resume</text>
    <rect x="660" y="352" width="140" height="26" rx="13" fill="#ffe6d3"/><text x="730" y="369" text-anchor="middle">Circuit breakers</text>
    <rect x="216" y="386" width="150" height="26" rx="13" fill="#ffe6d3"/><text x="291" y="403" text-anchor="middle">Confidence gating</text>
    <rect x="374" y="386" width="170" height="26" rx="13" fill="#ffe6d3"/><text x="459" y="403" text-anchor="middle">Fallback / degradation</text>
    <rect x="552" y="386" width="130" height="26" rx="13" fill="#ffe6d3"/><text x="617" y="403" text-anchor="middle">Bulkheads</text>
    <rect x="690" y="386" width="110" height="26" rx="13" fill="#ffe6d3"/><text x="745" y="403" text-anchor="middle">Rate limits</text>
  </g>

  <polygon points="530,434 520,424 540,424" fill="#9aa7bf"/>

  <!-- Tool layer -->
  <rect x="200" y="442" width="660" height="70" rx="10" fill="#f3f0fb" stroke="#d3c7ee"/>
  <text x="216" y="466" font-size="15" font-weight="700" fill="#3d2a75">Tool Layer — least-privilege adapters</text>
  <g font-size="11" fill="#3d2a75">
    <rect x="216" y="476" width="120" height="26" rx="6" fill="#e7ddfb"/><text x="276" y="493" text-anchor="middle">Scoped tokens</text>
    <rect x="344" y="476" width="140" height="26" rx="6" fill="#e7ddfb"/><text x="414" y="493" text-anchor="middle">Typed tool schemas</text>
    <rect x="492" y="476" width="150" height="26" rx="6" fill="#e7ddfb"/><text x="567" y="493" text-anchor="middle">Input/output validation</text>
    <rect x="650" y="476" width="150" height="26" rx="6" fill="#e7ddfb"/><text x="725" y="493" text-anchor="middle">Injection defense</text>
  </g>

  <polygon points="530,524 520,514 540,514" fill="#9aa7bf"/>

  <!-- External systems -->
  <rect x="200" y="532" width="660" height="78" rx="10" fill="#eef1f5" stroke="#c9d1dc"/>
  <text x="216" y="556" font-size="15" font-weight="700" fill="#1b1b1f">External Enterprise Systems</text>
  <g font-size="11" fill="#33445f">
    <rect x="216" y="566" width="115" height="34" rx="8" fill="#ffffff" stroke="#c9d1dc"/><text x="273" y="587" text-anchor="middle">Identity / Entra</text>
    <rect x="339" y="566" width="115" height="34" rx="8" fill="#ffffff" stroke="#c9d1dc"/><text x="396" y="587" text-anchor="middle">Licensing</text>
    <rect x="462" y="566" width="115" height="34" rx="8" fill="#ffffff" stroke="#c9d1dc"/><text x="519" y="587" text-anchor="middle">DNS / Domains</text>
    <rect x="585" y="566" width="130" height="34" rx="8" fill="#ffffff" stroke="#c9d1dc"/><text x="650" y="587" text-anchor="middle">Data / Graph</text>
    <rect x="723" y="566" width="117" height="34" rx="8" fill="#ffffff" stroke="#c9d1dc"/><text x="781" y="587" text-anchor="middle">Purview</text>
  </g>

  <!-- Learning & Accountability Plane (NEW) -->
  <rect x="30" y="628" width="1000" height="118" rx="10" fill="#f6faf7" stroke="#bfe0cc"/>
  <text x="46" y="652" font-size="15" font-weight="700" fill="#14562c">Learning &amp; Accountability Plane</text>
  <text x="300" y="652" font-size="11" fill="#5a5a66" font-style="italic">— fed by Observability &amp; Eval; closes the loop back into Agent Core</text>

  <rect x="46" y="662" width="228" height="72" rx="8" fill="#ffffff" stroke="#bfe0cc"/>
  <text x="160" y="684" font-size="12.5" font-weight="700" fill="#14562c" text-anchor="middle">Audit &amp; Trace Store</text>
  <text x="160" y="703" font-size="10.5" fill="#33445f" text-anchor="middle">immutable trajectory log ·</text>
  <text x="160" y="718" font-size="10.5" fill="#33445f" text-anchor="middle">deterministic replay</text>

  <rect x="288" y="662" width="228" height="72" rx="8" fill="#ffffff" stroke="#bfe0cc"/>
  <text x="402" y="684" font-size="12.5" font-weight="700" fill="#14562c" text-anchor="middle">Accountability</text>
  <text x="402" y="703" font-size="10.5" fill="#33445f" text-anchor="middle">action attribution ·</text>
  <text x="402" y="718" font-size="10.5" fill="#33445f" text-anchor="middle">explainability · ownership</text>

  <rect x="530" y="662" width="228" height="72" rx="8" fill="#ffffff" stroke="#bfe0cc"/>
  <text x="644" y="684" font-size="12.5" font-weight="700" fill="#14562c" text-anchor="middle">Self-Healing Controller</text>
  <text x="644" y="703" font-size="10.5" fill="#33445f" text-anchor="middle">detect · diagnose ·</text>
  <text x="644" y="718" font-size="10.5" fill="#33445f" text-anchor="middle">remediate · verify</text>

  <rect x="772" y="662" width="242" height="72" rx="8" fill="#ffffff" stroke="#bfe0cc"/>
  <text x="893" y="684" font-size="12.5" font-weight="700" fill="#14562c" text-anchor="middle">RL Learning Loop</text>
  <text x="893" y="703" font-size="10.5" fill="#33445f" text-anchor="middle">reward signal · RLHF/RLAIF ·</text>
  <text x="893" y="718" font-size="10.5" fill="#33445f" text-anchor="middle">offline eval gate → promote</text>

  <!-- feedback loop arrow: plane -> agent core -->
  <path d="M30,690 L14,690 L14,160 L200,160" fill="none" stroke="#2f8f57" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#fb)"/>
  <text x="20" y="415" font-size="11" fill="#2f8f57" font-style="italic" transform="rotate(-90 20 415)">policy / model / prompt update</text>

  <text x="30" y="766" font-size="11" fill="#8a8a96">Design principles: idempotency by default · least privilege · observability first · human-gated escalation · bounded blast radius · everything attributable &amp; replayable.</text>
</svg>
